name: Publish Agent Sandbox Chart

on:
  workflow_dispatch:
  push:
    branches: ['**']
    paths:
      - '.github/agent-sandbox-chart.json'
      - '.github/workflows/publish-agent-sandbox-chart.yaml'
      - 'scripts/agent-sandbox-chart.py'
  pull_request:
    paths:
      - '.github/agent-sandbox-chart.json'
      - '.github/workflows/publish-agent-sandbox-chart.yaml'
      - 'scripts/agent-sandbox-chart.py'

permissions:
  contents: read

concurrency:
  group: agent-sandbox-chart-${{ github.repository }}
  cancel-in-progress: false

jobs:
  package:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Read pinned upstream revision
        id: source
        run: echo "commit=$(jq -r .upstream_commit .github/agent-sandbox-chart.json)" >> "$GITHUB_OUTPUT"
      - name: Checkout upstream chart
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: kubernetes-sigs/agent-sandbox
          ref: ${{ steps.source.outputs.commit }}
          path: .local/agent-sandbox
          persist-credentials: false
      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@ef8a148080ab6020fd15196c2084a2eea5ff2d25 # v22
      - name: Setup Nix Cache
        uses: DeterminateSystems/magic-nix-cache-action@908b263ff629f4cc17666315b7fd3ec127c6244d # v14
      - name: Lint, package, and render
        run: nix run .#agent-sandbox-chart -- prepare --source .local/agent-sandbox/helm --output .cache/agent-sandbox/publish
      - name: Login and publish
        if: ${{ github.event_name != 'pull_request' && github.repository == 'isning/k8s-gitops' }}
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GHCR_USER: ${{ github.actor }}
        run: |
          printf '%s' "$GHCR_TOKEN" | nix run nixpkgs#kubernetes-helm -- registry login ghcr.io --username "$GHCR_USER" --password-stdin
          nix run .#agent-sandbox-chart -- publish --output .cache/agent-sandbox/publish
      - name: Upload packaged chart and rendered manifests
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: agent-sandbox-chart
          path: .cache/agent-sandbox/publish/*
          if-no-files-found: error
