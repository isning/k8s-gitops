---
enableIPv4Masquerade: true
kubeProxyReplacement: true
apiServerURLs: []
devices: ovsbr+
bpf:
  datapathMode: netkit-l2
  masquerade: false
  distributedLRU:
    enabled: true
  mapDynamicSizeRatio: 0.01
routingMode: native
autoDirectNodeRoutes: true
bandwidthManager:
  enabled: true
  bbr: true
loadBalancer:
  mode: dsr
  acceleration: best-effort
bpfClockProbe: true
cni:
  exclusive: false
socketLB:
  hostNamespaceOnly: true
l7Proxy: false
ipv6:
  enabled: true
enableIPv6Masquerade: true
l2announcements:
  enabled: true
k8sClientRateLimit:
  qps: 100
  burst: 200
hubble:
  enabled: true
  relay:
    enabled: true
  ui:
    enabled: true
rollOutCiliumPods: true
k8s:
  apiServerURLs: https://192.168.1.101:6443
ipv4NativeRoutingCIDR: 172.16.0.0/16
ipv6NativeRoutingCIDR: fdfd:cafe:00:0001::/64
operator:
  replicas: 1
