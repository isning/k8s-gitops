---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: headlamp
spec:
  releaseName: headlamp
  interval: 30m
  chart:
    spec:
      chart: headlamp
      sourceRef:
        kind: HelmRepository
        name: helm-repo-headlamp
      version: 0.44.0
      interval: 12h
  values:
    httpRoute:
      enabled: true
      annotations: {}
      labels: {}
      parentRefs:
      - name: default-gateway
      hostnames:
      - headlamp.isning.moe
    config:
      watchPlugins: true
      oidc:
        clientID: xktx7x81fvdwvx3a0ly62
        issuerURL: https://logto.isning.moe/oidc
        scopes: openid email profile offline_access roles
        usePKCE: true
        useCookie: false
        meUserInfoURL: https://logto.isning.moe/oidc/me
    resources:
      requests:
        cpu: 10m
        memory: 32Mi
      limits:
        cpu: 200m
        memory: 512Mi
    volumes:
    - name: plugin-flux
      image:
        reference: ghcr.io/headlamp-k8s/headlamp-plugin-flux:v0.7.0
        pullPolicy: IfNotPresent
    - name: plugin-kubevirt
      image:
        reference: ghcr.io/naval-group/headlamp-kubevirt:0.3.1
        pullPolicy: IfNotPresent
    volumeMounts:
    - name: plugin-flux
      mountPath: /headlamp/static-plugins/flux
      subPath: plugins/flux/
    - name: plugin-kubevirt
      mountPath: /headlamp/static-plugins/kubevirt
      subPath: plugins/kubevirt/
    podSecurityContext:
      fsGroup: 101
    pluginsManager:
      enabled: true
      baseImage: node:24-alpine
      version: 0.1.1
      env:
      - name: HOME
        value: /tmp
      - name: NODE_USE_ENV_PROXY
        value: '1'
      - name: HTTP_PROXY
        value: http://proxy-svc.egress-system.svc.cluster.local:7890
      - name: HTTPS_PROXY
        value: http://proxy-svc.egress-system.svc.cluster.local:7890
      - name: NO_PROXY
        value: localhost,127.0.0.1,.svc,.cluster.local
      resources:
        requests:
          cpu: 10m
          memory: 64Mi
        limits:
          cpu: 500m
          memory: 512Mi
      configContent: |
        plugins:
          - name: cert-manager
            source: https://artifacthub.io/packages/headlamp/headlamp-plugins/headlamp_cert-manager
            version: "0.1.1"
