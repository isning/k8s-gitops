---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../base/cloudnative-pg/
  - ../../base/egress/
  - ../../base/kubevirt/
  - ../../base/redroid-operator/
  - ../../base/dragonfly-operator/

patches:
  - target:
      kind: Deployment
      name: virt-operator
      namespace: kubevirt
    patch: |-
      - op: replace
        path: /spec/replicas
        value: 1
