apiVersion: batch/v1
kind: CronJob
metadata:
  name: ipv6-pool-reconciler
  namespace: kube-system
spec:
  schedule: "*/5 * * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 1
  jobTemplate:
    spec:
      backoffLimit: 2
      activeDeadlineSeconds: 240
      ttlSecondsAfterFinished: 3600
      template:
        metadata:
          labels:
            app.kubernetes.io/name: ipv6-pool-reconciler
        spec:
          serviceAccountName: ipv6-pool-reconciler
          hostNetwork: true
          dnsPolicy: ClusterFirstWithHostNet
          nodeSelector:
            kubernetes.io/hostname: whitefox
          restartPolicy: Never
          securityContext:
            runAsNonRoot: true
            runAsUser: 65532
            runAsGroup: 65532
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: reconcile
              image: docker.io/library/python:3.14-alpine@sha256:c6ead215bfd31f1e433d968853b7a769989117115b728874824e6c0a27cb96fc
              command: ["python3", "/opt/reconciler/reconcile.py"]
              env:
                - name: IPV6_INTERFACE
                  value: ovsbr1
                - name: IPV6_ROUTE_TARGET
                  value: "2001:4860:4860::8888"
                - name: POOL_NAME
                  value: default-public-ipv6-pool
                - name: POOL_SUBNET_HEXTET
                  value: caf0
                - name: EDGEONE_TERRAFORM_NAMESPACE
                  value: prod
                - name: EDGEONE_TERRAFORM_NAME
                  value: coder-edgeone-control
              resources:
                requests:
                  cpu: 10m
                  memory: 24Mi
                limits:
                  cpu: 100m
                  memory: 64Mi
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop: ["ALL"]
              volumeMounts:
                - name: script
                  mountPath: /opt/reconciler
                  readOnly: true
          volumes:
            - name: script
              configMap:
                name: ipv6-pool-reconciler-script
                defaultMode: 0444
