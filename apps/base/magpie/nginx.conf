worker_processes 1;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;
events { worker_connections 512; }
http {
    access_log off;
    client_body_temp_path /tmp/client_body;
    proxy_temp_path /tmp/proxy;
    fastcgi_temp_path /tmp/fastcgi;
    uwsgi_temp_path /tmp/uwsgi;
    scgi_temp_path /tmp/scgi;

    map $http_upgrade $connection_upgrade {
        default upgrade;
        '' close;
    }
    # Injecting a cookie removes Magpie's browser-side CSRF boundary. Require
    # the dashboard Origin for mutations, and reject foreign Origins on reads.
    map "$request_method:$http_origin" $reject_origin {
        default 1;
        ~^(GET|HEAD|OPTIONS):$ 0;
        ~^[A-Z]+:https://llm-dash\.isning\.moe$ 0;
    }
    server {
        listen 8080;
        server_name llm-dash.isning.moe;
        client_max_body_size 32m;

        location = /healthz {
            access_log off;
            return 200 'ok';
        }
        # Browser authentication is exclusively handled by gateway OAuth.
        location = /_magpie/sign-in { return 404; }
        location / {
            if ($reject_origin) { return 403; }
            if ($arg_k != '') { return 400; }
            proxy_pass http://127.0.0.1:3430;
            proxy_http_version 1.1;
            proxy_set_header Host llm-dash.isning.moe;
            proxy_set_header X-Forwarded-Proto https;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Cookie "magpie_web_3430=$MAGPIE_INTERNAL_WEB_KEY";
            proxy_hide_header Set-Cookie;
            proxy_buffering off;
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
        }
    }
}
