---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: harbor
  namespace: harbor
spec:
  releaseName: harbor
  interval: 30m
  chart:
    spec:
      chart: harbor
      sourceRef:
        kind: HelmRepository
        name: harbor
        namespace: flux-system
      version: 1.*
      interval: 12h
  values:
    existingSecretAdminPassword: harbor-admin-auth
    existingSecretAdminPasswordKey: HARBOR_ADMIN_PASSWORD
    expose:
      type: route
      route:
        hosts:
        - harbor.isning.moe
        parentRefs:
        - group: gateway.networking.k8s.io
          kind: Gateway
          name: default-gateway
          namespace: prod
      tls:
        enabled: false
    externalURL: https://harbor.isning.moe
    proxy:
      httpProxy: http://proxy-svc.egress-system.svc.cluster.local:7890
      httpsProxy: http://proxy-svc.egress-system.svc.cluster.local:7890
      noProxy: 127.0.0.1,localhost,.svc,.cluster.local,harbor.harbor.svc,core,jobservice,registry,portal
    database:
      type: external
      external:
        host: harbor-pg-cluster-rw
        port: 5432
        username: app
        existingSecret: harbor-pg-cluster-app
        coreDatabase: registry
    redis:
      type: external
      external:
        addr: harbor-dragonfly:6379
        username: default
        existingSecret: harbor-redis-auth
    trivy:
      enabled: false
    persistence:
      enabled: true
      resourcePolicy: keep
      persistentVolumeClaim:
        registry:
          size: 100Gi
        jobservice:
          jobLog:
            size: 5Gi
        database:
          size: 10Gi
        redis:
          size: 5Gi
    core:
      extraEnvVars:
      - name: OIDC_CLIENT_ID
        valueFrom:
          secretKeyRef:
            name: harbor-managed-oidc
            key: clientId
      - name: OIDC_CLIENT_SECRET
        valueFrom:
          secretKeyRef:
            name: harbor-managed-oidc
            key: clientSecret
      - name: CONFIG_OVERWRITE_JSON
        value: '{"self_registration":false,"auth_mode":"oidc_auth","primary_auth_mode":true,"oidc_name":"Logto
          ISNing","oidc_endpoint":"https://logto.isning.moe/oidc","oidc_scope":"openid,profile,email,roles,offline_access","oidc_client_id":"$(OIDC_CLIENT_ID)","oidc_client_secret":"$(OIDC_CLIENT_SECRET)","oidc_verify_cert":true,"oidc_auto_onboard":true,"oidc_user_claim":"username","oidc_groups_claim":"roles","oidc_group_filter":"^harbor:[a-z]+$","oidc_admin_group":"harbor:admin","oidc_logout":true}'
  postRenderers:
  - kustomize:
      patches:
      - target:
          version: v1
          kind: ConfigMap
          name: harbor-core
          namespace: harbor
        patch: "apiVersion: v1\nkind: ConfigMap\nmetadata:\n  name: harbor-core\n  namespace: harbor\n\
          data:\n  PERMITTED_REGISTRY_TYPES_FOR_PROXY_CACHE: \"ali-acr,aws-ecr,azure-acr,docker-hub,docker-registry,github-ghcr,google-gcr,harbor,huawei-SWR,jfrog-artifactory,tencent-tcr,volcengine-cr\"\
          \n  REPLICATION_ADAPTER_WHITELIST: \"ali-acr,aws-ecr,azure-acr,docker-hub,docker-registry,github-ghcr,google-gcr,harbor,huawei-SWR,jfrog-artifactory,tencent-tcr,volcengine-cr\"\
          \n"
