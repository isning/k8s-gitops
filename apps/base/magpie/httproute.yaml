apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: metapi-route
  labels:
    app: magpie
spec:
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: default-gateway
  hostnames:
    - llm-dash.isning.moe
  rules:
    - backendRefs:
        - name: magpie
          port: 80
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: metapi-api
  labels:
    app: magpie
spec:
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: default-gateway
  hostnames:
    - llm.isning.moe
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /v1
        - path:
            type: PathPrefix
            value: /v1beta
        - path:
            type: PathPrefix
            value: /mcp
      backendRefs:
        - name: magpie
          port: 3425
      timeouts:
        request: 3600s
