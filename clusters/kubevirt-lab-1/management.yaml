---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: management-providers
  namespace: flux-system
spec:
  interval: 5m
  retryInterval: 30s
  timeout: 10m
  dependsOn:
  - name: infra-pre-controllers
  sourceRef:
    kind: GitRepository
    name: flux-system
  path: ./infra/pre-controllers/base/crossplane/providers
  prune: false
  suspend: false
  decryption:
    provider: sops
    secretRef:
      name: sops-age
  healthChecks:
  - apiVersion: pkg.crossplane.io/v1
    kind: Provider
    name: provider-upjet-logto
  - apiVersion: pkg.crossplane.io/v1
    kind: Provider
    name: provider-upjet-harbor
  - apiVersion: pkg.crossplane.io/v1
    kind: Function
    name: function-go-templating
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: management-configs
  namespace: flux-system
spec:
  interval: 5m
  retryInterval: 30s
  timeout: 10m
  dependsOn:
  - name: management-providers
  - name: infra-configs
  sourceRef:
    kind: GitRepository
    name: flux-system
  path: ./infra/pre-controllers/base/crossplane/configs
  prune: false
  suspend: true
  decryption:
    provider: sops
    secretRef:
      name: sops-age
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: identity-applications
  namespace: flux-system
spec:
  interval: 5m
  retryInterval: 30s
  timeout: 10m
  dependsOn:
  - name: management-configs
  - name: apps
  sourceRef:
    kind: GitRepository
    name: flux-system
  path: ./apps/overlays/kubevirt-lab-1/identity
  prune: false
  suspend: true
  decryption:
    provider: sops
    secretRef:
      name: sops-age
