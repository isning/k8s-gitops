---
kind: will-be-ignored
metadata:
  name: will-be-ignored
spec:
  values:
    # Apply ConfigMap changes to the agent, not just to Helm's release state.
    rollOutCiliumPods: true
    # https://github.com/cilium/cilium/pull/37601
    k8s:
      # Space separated
      apiServerURLs: https://192.168.1.101:6443

    # TODO: Add services CIDR after Cilium supports multiple CIDRs: https://github.com/cilium/cilium/issues/21945
    ipv4NativeRoutingCIDR: 172.16.0.0/16
    ipv6NativeRoutingCIDR: fdfd:cafe:00:0001::/64

    operator:
      replicas: 1 # For now that I have only 1 node

    bpf:
      # Single-node home workload: keep headroom without multi-million-entry maps.
      # Resizing maps can reset connections; observe map pressure after rollout.
      mapDynamicSizeRatio: 0.01
      # Use l2 insead l3 for KubeVirt compatability https://github.com/cilium/cilium/issues/37265#issuecomment-2626483413
      datapathMode: netkit-l2

    # ============================  L2 Announcements  ============================
    # https://docs.cilium.io/en/stable/network/l2-announcements/
    k8sClientRateLimit:
      qps: 100
      burst: 200
