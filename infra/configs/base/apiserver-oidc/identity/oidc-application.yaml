---
apiVersion: application.logto.m.crossplane.io/v1alpha1
kind: Application
metadata:
  name: kubernetes-cluster
  namespace: flux-system
  annotations:
    crossplane.io/external-name: xktx7x81fvdwvx3a0ly62
spec:
  managementPolicies:
  - Observe
  forProvider:
    name: Kubernetes Cluster
    type: SPA
    description: ''
    isThirdParty: false
    redirectUris:
    - http://localhost:8000
    - http://localhost:18000
    - https://kiali.isning.moe
    - https://headlamp.isning.moe/oidc-callback
    postLogoutRedirectUris: []
    corsAllowedOrigins: []
    oidcClientMetadataExtra: '{"backchannelLogoutSessionRequired":false}'
    customClientMetadataExtra: '{"idTokenTtl":3600,"refreshTokenTtlInDays":14,"alwaysIssueRefreshToken":false,"rotateRefreshToken":true,"allowTokenExchange":false}'
  writeConnectionSecretToRef:
    name: kubernetes-cluster-managed-application
  providerConfigRef:
    name: isning-logto
    kind: ClusterProviderConfig
