apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: magpie-ingress
spec:
  podSelector:
    matchLabels:
      app: magpie
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              gateway.networking.k8s.io/gateway-name: default-gateway
      ports:
        - protocol: TCP
          port: 8080
        - protocol: TCP
          port: 3425
        # Istio ambient ingress is tunneled over HBONE.
        - protocol: TCP
          port: 15008
