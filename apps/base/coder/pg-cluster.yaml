---
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: coder-pg-cluster
spec:
  # A single-node Kubernetes cluster has no independent failure domain for
  # database replicas. Keep one instance and rely on continuous R2 backups.
  instances: 1
  plugins:
    - name: barman-cloud.cloudnative-pg.io
      isWALArchiver: true
      parameters:
        barmanObjectName: coder-pg-objectstore
        serverName: coder-pg-cluster
  bootstrap:
    initdb:
      owner: coder
      database: coder
  imageCatalogRef:
    apiGroup: postgresql.cnpg.io
    kind: ClusterImageCatalog
    name: postgresql-minimal-trixie
    major: 16
  storage:
    size: 20Gi
    storageClass: local-path-nocow

  monitoring:
    enablePodMonitor: true
