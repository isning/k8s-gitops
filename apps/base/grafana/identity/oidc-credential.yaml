---
apiVersion: application.logto.m.crossplane.io/v1alpha1
kind: Secret
metadata:
  name: grafana-credential
  namespace: prod
  annotations:
    crossplane.io/paused: 'true'
    crossplane.io/external-name: 94sbueqrwkfne9im2ilhp/REPLACE_WITH_EXISTING_SECRET_NAME
spec:
  managementPolicies:
  - Observe
  forProvider:
    name: REPLACE_WITH_EXISTING_SECRET_NAME
    applicationIdRef:
      name: grafana
      policy:
        resolve: Always
  providerConfigRef:
    name: isning-logto
    kind: ClusterProviderConfig
  writeConnectionSecretToRef:
    name: grafana-managed-oidc
