---
apiVersion: harbor.isning.moe/v1alpha1
kind: ProxyCache
metadata:
  name: dockerhub
  namespace: harbor
spec:
  registry:
    name: dockerhub-upstream
    providerName: docker-hub
    endpointUrl: https://hub.docker.com
    externalID: REPLACE_WITH_EXISTING_REGISTRY_ID
  resourceManagementPolicies:
  - Observe
  providerConfigName: isning-harbor
  projectID: REPLACE_WITH_EXISTING_PROJECT_ID
