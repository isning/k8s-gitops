apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: paseo-home
  labels:
    app: paseo
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 5Gi
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: paseo-workspace
  labels:
    app: paseo
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 20Gi
