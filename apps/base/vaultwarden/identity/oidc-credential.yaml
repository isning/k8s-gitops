---
apiVersion: application.logto.m.crossplane.io/v1alpha1
kind: Secret
metadata:
  name: vaultwarden-credential
  namespace: prod
  annotations:
    crossplane.io/paused: 'true'
    crossplane.io/external-name: 4ggb667if8rr9gcgk51vq/REPLACE_WITH_EXISTING_SECRET_NAME
spec:
  managementPolicies:
  - Observe
  forProvider:
    name: REPLACE_WITH_EXISTING_SECRET_NAME
    applicationIdRef:
      name: vaultwarden
      policy:
        resolve: Always
  providerConfigRef:
    name: isning-logto
    kind: ClusterProviderConfig
  writeConnectionSecretToRef:
    name: vaultwarden-managed-oidc
