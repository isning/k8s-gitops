---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: kiali
  namespace: kiali-operator
spec:
  releaseName: kiali-operator
  interval: 30m
  chartRef:
    kind: OCIRepository
    name: helm-chart-kiali-operator
    namespace: kiali-operator
  values:
    cr:
      create: true
      namespace: kiali-operator
      spec:
        version: default
        auth:
          strategy: openid
          openid:
            client_id: ${clientId}
            issuer_uri: https://logto.isning.moe/oidc
            scopes:
            - openid
            - profile
            - roles
            username_claim: username
        deployment:
          cluster_wide_access: true
          ingress:
            enabled: false
          hpa:
            api_version: autoscaling/v1
            spec:
              minReplicas: 1
              maxReplicas: 2
              targetCPUUtilizationPercentage: 80
          instance_name: kiali
          namespace: kiali-operator
          network_policy:
            enabled: true
          replicas: 1
          resources:
            requests:
              cpu: 10m
              memory: 64Mi
            limits:
              memory: 1Gi
          view_only_mode: false
        installation_tag: Kiali@kubevirt-lab-1
        external_services:
          prometheus:
            auth:
              type: none
            cache_duration: 10
            cache_enabled: true
            cache_expiration: 300
            health_check_url: ''
            is_core: true
            query_scope:
              cluster: kubevirt-lab-1
            url: http://vmsingle-victoriametrics-vmks.monitoring.svc.cluster.local:8428
          grafana:
            auth:
              type: bearer
              use_kiali_token: true
            enabled: true
            is_core: false
            internal_url: http://grafana-service.prod.svc.cluster.local:3000/
            external_url: https://grafana.isning.moe
          tracing:
            enabled: false
        kiali_feature_flags:
          istio_annotation_action: true
          istio_injection_action: true
          istio_upgrade_action: false
          ui_defaults:
            i18n:
              language: en
              show_selector: true
        server:
          audit_log: true
          gzip_enabled: true
          port: 20001
          web_fqdn: ''
          web_port: ''
          web_root: /
          observability:
            metrics:
              enabled: true
              health_status:
                enabled: false
                max_consecutive_na: 3
              port: 9090
